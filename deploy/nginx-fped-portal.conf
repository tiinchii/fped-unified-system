# /etc/nginx/sites-available/fped-portal   (palitan ang planning.example.gov.ph at ang mga path ng certificate)
#
# Nginx lang ang bukas sa labas (443). Inihahatid nito ang React app at ipinapasa ang /api sa Spring Boot,
# na nakikinig lang sa 127.0.0.1:8080.

server {
    listen 80;
    server_name planning.example.gov.ph;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # sa Nginx 1.25.1 pataas: "listen 443 ssl;" at hiwalay na linyang "http2 on;"
    server_name planning.example.gov.ph;

    ssl_certificate     /etc/letsencrypt/live/planning.example.gov.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planning.example.gov.ph/privkey.pem;

    client_max_body_size 10m;

    root /var/www/fped-portal;
    index index.html;

    # Ang mga sagot ng /api ay may sarili nang security headers mula sa Spring Security.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Paalala: kapag may add_header sa loob ng location, hindi na minamana ang nasa labas nito,
    # kaya inuulit ang security headers sa bawat location ng React app.

    # ang mga file na may hash sa pangalan ay hindi nagbabago, kaya puwedeng i-cache nang matagal
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # lahat ng iba (hal. /admin/users) ay sa React app
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
